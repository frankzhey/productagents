  <line x1="650" y1="345" x2="290" y2="345" stroke="#ea580c" stroke-width="2"/><polygon points="290,345 300,339 300,351" fill="#ea580c"/><text x="470" y="361" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">reuse existing taskId</text>
