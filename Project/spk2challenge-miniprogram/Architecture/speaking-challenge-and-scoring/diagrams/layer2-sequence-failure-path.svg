  <line x1="830" y1="525" x2="650" y2="525" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 5"/><polygon points="650,525 660,519 660,531" fill="#dc2626"/><text x="740" y="542" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">timeout/failure</text>
