  <line x1="290" y1="175" x2="470" y2="175" stroke="#334155" stroke-width="2"/><polygon points="470,175 460,169 460,181" fill="#334155"/><text x="380" y="167" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">complete upload</text>
  <line x1="470" y1="200" x2="290" y2="200" stroke="#dc2626" stroke-width="2"/><polygon points="290,200 300,194 300,206" fill="#dc2626"/><text x="380" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">reject, no task</text>
