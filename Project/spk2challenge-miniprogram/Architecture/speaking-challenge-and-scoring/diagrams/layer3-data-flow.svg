<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" width="1080" height="680" role="img" aria-label="Data Flow">
  <rect x="0" y="0" width="1080" height="680" fill="#ffffff"/>
  <text x="40" y="42" font-family="sans-serif" font-size="22" font-weight="700" fill="#111827">Data Flow - Voice, Score, Handoff</text>
  <rect x="60" y="115" width="150" height="65" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="135" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#064e3b">Voice Audio</text>
  <rect x="285" y="115" width="150" height="65" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="360" y="152" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#1e3a8a">Object Store</text>
  <rect x="510" y="115" width="165" height="65" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="592" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#9a3412">Scoring Task</text>
  <text x="592" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#9a3412">taskId + state</text>
  <rect x="745" y="115" width="160" height="65" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="825" y="145" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4c1d95">AI Score</text>
  <text x="825" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b21b6">raw output</text>
  <rect x="510" y="300" width="165" height="75" rx="10" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="592" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4c1d95">Result View</text>
  <text x="592" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5b21b6">band + CEFR</text>
  <rect x="745" y="300" width="160" height="75" rx="10" fill="#ecfdf5" stroke="#059669"/>
  <text x="825" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#064e3b">Website Link</text>
  <text x="825" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#065f46">score bucket</text>
  <rect x="285" y="300" width="150" height="75" rx="10" fill="#f9fafb" stroke="#6b7280"/>
  <text x="360" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#374151">Analytics</text>
  <text x="360" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">K6 K7 K8 K9</text>
  <rect x="60" y="300" width="150" height="75" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="135" y="330" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#7f1d1d">Audit</text>
  <text x="135" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#991b1b">access trace</text>
  <g stroke="#334155" stroke-width="2.5" fill="none" font-family="sans-serif" font-size="12">
    <path d="M210 148 L285 148"/><polygon points="285,148 275,142 275,154" fill="#334155"/><text x="247" y="140" text-anchor="middle" fill="#334155">audio file</text>
    <path d="M435 148 L510 148"/><polygon points="510,148 500,142 500,154" fill="#334155"/><text x="472" y="140" text-anchor="middle" fill="#334155">audioRef</text>
    <path d="M675 148 L745 148"/><polygon points="745,148 735,142 735,154" fill="#334155"/><text x="710" y="140" text-anchor="middle" fill="#334155">score request</text>
    <path d="M825 180 L610 300"/><polygon points="610,300 615,288 621,299" fill="#334155"/><text x="720" y="245" text-anchor="middle" fill="#334155">structured score</text>
    <path d="M675 338 L745 338"/><polygon points="745,338 735,332 735,344" fill="#334155"/><text x="710" y="330" text-anchor="middle" fill="#334155">bucket only</text>
    <path d="M510 355 L435 355" stroke-dasharray="6 5"/><polygon points="435,355 445,349 445,361" fill="#334155"/><text x="472" y="375" text-anchor="middle" fill="#334155">events</text>
    <path d="M285 338 L210 338" stroke-dasharray="6 5"/><polygon points="210,338 220,332 220,344" fill="#334155"/><text x="247" y="330" text-anchor="middle" fill="#334155">audit</text>
  </g>
